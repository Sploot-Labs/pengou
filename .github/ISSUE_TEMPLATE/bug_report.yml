name: 🐛 Rapport de bug
description: Quelque chose ne fonctionne pas comme attendu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug. 🐾
        (Une faille de sécurité ? Ne l'ouvre pas ici — suis SECURITY.md.)
  - type: textarea
    id: what-happened
    attributes:
      label: Que s'est-il passé ?
      description: Décris le problème, et ce à quoi tu t'attendais.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      description: Comment reproduire, étape par étape.
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag, version d'image, ou hash de commit.
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: Environnement
      options:
        - Self-host (Docker)
        - Développement local
        - Autre
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte / logs
      description: Logs, captures d'écran, navigateur, OS… tout ce qui peut aider.
    validations:
      required: false
