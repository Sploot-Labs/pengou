name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux du GITHUB_TOKEN : lecture seule du dépôt.
permissions:
  contents: read

# Annule les exécutions précédentes encore en cours sur la même réf (économie de runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (lit packageManager: pnpm@… dans package.json)

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Les suites DB/e2e utilisent @testcontainers/postgresql : Docker est disponible
      # d'office sur ubuntu-latest. Timeout généreux pour le premier pull d'image Postgres.
      - name: Test
        run: pnpm test
        timeout-minutes: 15
