name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux du GITHUB_TOKEN : lecture seule du dépôt.
permissions:
  contents: read

# Annule les exécutions précédentes encore en cours sur la même réf (économie de runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (lit packageManager: pnpm@… dans package.json)

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `biome check` = lint + formatage : un fichier mal formaté fait échouer la CI.
      - name: Lint et formatage (Biome)
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Les suites DB/e2e utilisent @testcontainers/postgresql : Docker est disponible
      # d'office sur ubuntu-latest. Timeout généreux pour le premier pull d'image Postgres.
      - name: Test
        run: pnpm test
        timeout-minutes: 15
