name: Audit

# Audit hebdomadaire des dépendances. L'audit au fil de l'eau est délégué à Dependabot.
on:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informel : ne bloque rien, mais rend les vulnérabilités visibles dans les logs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
