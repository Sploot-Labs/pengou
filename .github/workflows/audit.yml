name: Audit

# Audit hebdomadaire des dépendances. L'audit au fil de l'eau est délégué à Dependabot.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informel : ne bloque rien, mais rend les vulnérabilités visibles dans les logs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
