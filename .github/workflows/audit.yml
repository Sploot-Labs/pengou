name: Audit

# Audit hebdomadaire des dépendances. L'audit au fil de l'eau est délégué à Dependabot.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informel : ne bloque rien, mais rend les vulnérabilités visibles dans les logs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
