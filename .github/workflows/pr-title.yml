name: Titre de PR

# Les PR sont fusionnées en squash et le titre de la PR devient le message du commit sur main
# (réglage du dépôt « Default to pull request title »). Ce contrôle exige donc un titre au format
# Conventional Commits : `type(portée facultative): description`.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  titre:
    name: titre conventionnel
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier le titre
        # Le titre passe par une variable d'environnement, jamais interpolé dans le script :
        # un titre contenant `$(...)` ne doit pas s'exécuter.
        env:
          TITRE: ${{ github.event.pull_request.title }}
        run: |
          motif='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITRE" | grep -Eq "$motif"; then
            echo "Titre conforme : $TITRE"
          else
            echo "::error::Titre non conforme à Conventional Commits : « $TITRE »."
            echo "Format attendu : type(portée): description, par exemple « feat(charge): campagne de charge lancée à la main »."
            echo "Types acceptés : feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi
