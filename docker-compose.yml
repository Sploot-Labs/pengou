services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pengou
      POSTGRES_PASSWORD: pengou
      POSTGRES_DB: pengou
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pengou"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      TENANCY_MODE: single
      DATABASE_URL: postgres://pengou:pengou@db:5432/pengou
      SESSION_SECRET: change-me-in-production-please!!
      # AUCUNE valeur par défaut ici, INTENTIONNELLEMENT (hardening) : un placeholder committé
      # (même ≥32 caractères, donc valide aux yeux du garde de production dans loadConfig)
      # serait une clé de signature PUBLIQUEMENT CONNUE dans l'historique git — un copier-coller
      # de ce fichier en déploiement réel signerait alors des sessions avec un secret que
      # N'IMPORTE QUI peut lire sur GitHub. `${BETTER_AUTH_SECRET:?...}` fait échouer `docker
      # compose up` IMMÉDIATEMENT (avant même de démarrer le conteneur) avec un message clair si
      # la variable n'est pas définie dans l'environnement du shell ou un fichier `.env` local
      # (non commité — voir `.env.example`) : `openssl rand -base64 32` puis
      # `export BETTER_AUTH_SECRET=...` (ou renseignez `.env`) avant `docker compose up`.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Définissez BETTER_AUTH_SECRET (≥32 caractères, ex. openssl rand -base64 32) dans votre environnement ou un fichier .env avant docker compose up — voir .env.example.}
      # Origine publique de l'app = seule origine de confiance Better Auth (validation Origin des
      # requêtes d'auth) ET seule origine autorisée par le CORS Socket.IO. Surchargeable par
      # l'environnement / `.env` (non commité) pour exposer l'app via un tunnel (ngrok) le temps
      # d'un test : y mettre l'URL HTTPS publique du tunnel. Défaut : localhost.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Mot de passe du rôle app_role (soumis au RLS) ; le défaut de développement est refusé en production.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Définissez APP_DB_PASSWORD (ex. openssl rand -base64 24) dans votre environnement ou un fichier .env avant docker compose up — voir .env.example.}
      # Proxys de confiance pour X-Forwarded-For (vide par défaut). Derrière un tunnel (ngrok) ou un
      # reverse proxy, y mettre l'IP ou le CIDR du proxy vu depuis le conteneur (voir docs/devops.md).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Providers OAuth sociaux (optionnels) : décommenter et renseigner pour les activer.
      # Voir enabledSocialProviders() dans packages/auth/src/providers.ts.
      # GOOGLE_CLIENT_ID:
      # GOOGLE_CLIENT_SECRET:
      # FACEBOOK_CLIENT_ID:
      # FACEBOOK_CLIENT_SECRET:
      # GITHUB_CLIENT_ID:
      # GITHUB_CLIENT_SECRET:
      # Plafond de joueurs par partie (voir docs/charge).
      MAX_PLAYERS_PER_SESSION: ${MAX_PLAYERS_PER_SESSION:-640}
      # Envoi d'e-mails : en développement, tout part vers Mailpit (interface sur
      # http://localhost:8025, aucun message ne quitte la machine). Pour un vrai transport,
      # surchargez ces variables dans l'environnement ou un `.env` local (voir docs/devops.md,
      # section « Envoi d'e-mails »).
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Mailpit n'offre pas STARTTLS : on lève l'exigence de TLS pour ce relais local seulement.
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Pengou <contact@pengou.fr>}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Serveur SMTP de développement : capture les e-mails envoyés par l'app. Interface web sur
  # http://localhost:8025 ; le port SMTP 1025 reste interne au réseau Compose (non publié).
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "8025:8025"

volumes:
  db-data:
