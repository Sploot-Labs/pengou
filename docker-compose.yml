services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pengou
      POSTGRES_PASSWORD: pengou
      POSTGRES_DB: pengou
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pengou"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      TENANCY_MODE: single
      DATABASE_URL: postgres://pengou:pengou@db:5432/pengou
      SESSION_SECRET: change-me-in-production-please!!
      # AUCUNE valeur par défaut ici, INTENTIONNELLEMENT (hardening) : un placeholder committé
      # (même ≥32 caractères, donc valide aux yeux du garde de production dans loadConfig)
      # serait une clé de signature PUBLIQUEMENT CONNUE dans l'historique git — un copier-coller
      # de ce fichier en déploiement réel signerait alors des sessions avec un secret que
      # N'IMPORTE QUI peut lire sur GitHub. `${BETTER_AUTH_SECRET:?...}` fait échouer `docker
      # compose up` IMMÉDIATEMENT (avant même de démarrer le conteneur) avec un message clair si
      # la variable n'est pas définie dans l'environnement du shell ou un fichier `.env` local
      # (non commité — voir `.env.example`) : `openssl rand -base64 32` puis
      # `export BETTER_AUTH_SECRET=...` (ou renseignez `.env`) avant `docker compose up`.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Définissez BETTER_AUTH_SECRET (≥32 caractères, ex. openssl rand -base64 32) dans votre environnement ou un fichier .env avant docker compose up — voir .env.example.}
      # Origine publique de l'app = seule origine de confiance Better Auth (validation Origin des
      # requêtes d'auth) ET seule origine autorisée par le CORS Socket.IO. Surchargeable par
      # l'environnement / `.env` (non commité) pour exposer l'app via un tunnel (ngrok) le temps
      # d'un test : y mettre l'URL HTTPS publique du tunnel. Défaut : localhost.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Providers OAuth sociaux (optionnels) : décommenter et renseigner pour les activer.
      # Voir enabledSocialProviders() dans packages/auth/src/providers.ts.
      # GOOGLE_CLIENT_ID:
      # GOOGLE_CLIENT_SECRET:
      # FACEBOOK_CLIENT_ID:
      # FACEBOOK_CLIENT_SECRET:
      # GITHUB_CLIENT_ID:
      # GITHUB_CLIENT_SECRET:
      # Plafond de joueurs par partie (voir docs/charge).
      MAX_PLAYERS_PER_SESSION: ${MAX_PLAYERS_PER_SESSION:-640}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
